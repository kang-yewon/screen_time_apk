name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BrickLock-debug.apk
          cp app/build/outputs/apk/release/app-release.apk BrickLock-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrickLock-APK
          path: |
            BrickLock-debug.apk
            BrickLock-release.apk

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "벽돌 타이머 (BrickLock) APK v1.0.${{ github.run_number }}"
          body: |
            스크린타임 조절 벽돌 타이머 APK 빌드입니다.
            - `BrickLock-release.apk` 또는 `BrickLock-debug.apk`를 다운로드하여 안드로이드 휴대폰에 설치하세요.
          files: |
            BrickLock-debug.apk
            BrickLock-release.apk
